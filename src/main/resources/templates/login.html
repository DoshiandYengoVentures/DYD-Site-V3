<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Doshi and Yengo Digital</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css" />
</head>
<body>

<div class="db-root">
  <div class="db-auth-shell">
    <div class="db-auth-card">
      <div class="db-auth-logo">
        <span class="db-logo-mark" aria-hidden="true" style="background:var(--db-blue);"></span>
        <span>Doshi and Yengo Digital</span>
      </div>

      <h1>Sign in to your dashboard</h1>
      <p>Manage your website, services, and messages in one place.</p>

      <div class="db-alert db-alert-error" th:if="${param.error}" role="alert">
        Incorrect email or password. Please try again.
      </div>
      <div class="db-alert db-alert-info" th:if="${param.logout}" role="status">
        You've been signed out.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="db-field">
          <label for="username">Email</label>
          <input type="email" id="username" name="username" autocomplete="username" required autofocus />
        </div>
        <div class="db-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="db-btn db-btn-primary db-btn-block">Sign In</button>
      </form>

      <div class="db-demo-hint">
        <strong>Demo login</strong><br />
        Email: demo@doshiyengo.digital<br />
        Password: Demo1234!
      </div>

      <a class="db-auth-back" href="/">← Back to the main site</a>
    </div>
  </div>
</div>

</body>
</html>
