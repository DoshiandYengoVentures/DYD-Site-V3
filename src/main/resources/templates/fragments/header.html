<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="site-header" th:fragment="header">
  <div class="container nav">
    <a class="logo" href="/" aria-label="Doshi and Yengo Digital — home">
      <span class="logo-mark" aria-hidden="true"></span>
      Doshi and Yengo Digital
      <span class="logo-cursor" aria-hidden="true">_</span>
    </a>

    <nav class="nav-links" aria-label="Primary">
      <a class="nav-link" href="/" th:classappend="${activePage == 'home'} ? 'is-active' : ''">Home</a>

      <div class="nav-group">
        <a class="nav-link" href="/services/website-design" role="button" aria-haspopup="true"
           th:classappend="${#lists.contains({'website-design','business-automation','ai-solutions','seo'}, activePage)} ? 'is-active' : ''">
          Services
        </a>
        <div class="nav-submenu">
          <a href="/services/website-design">Website Design</a>
          <a href="/services/business-automation">Business Automation</a>
          <a href="/services/ai-solutions">AI Solutions</a>
          <a href="/services/seo">SEO</a>
        </div>
      </div>

      <a class="nav-link" href="/portfolio" th:classappend="${activePage == 'portfolio'} ? 'is-active' : ''">Portfolio</a>
      <a class="nav-link" href="/about" th:classappend="${activePage == 'about'} ? 'is-active' : ''">About</a>
      <a class="nav-link" href="/contact" th:classappend="${activePage == 'contact'} ? 'is-active' : ''">Contact</a>
      <a class="nav-link" href="/login">Client Login</a>
    </nav>

    <div class="nav-right">
      <a class="btn btn-primary" href="/contact">Get a Free Quote</a>
      <button class="hamburger" type="button" aria-label="Toggle navigation menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

</body>
</html>
