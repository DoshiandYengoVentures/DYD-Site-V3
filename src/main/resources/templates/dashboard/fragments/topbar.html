<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="db-topbar" th:fragment="topbar">
  <button class="db-hamburger" type="button" aria-label="Toggle sidebar" aria-expanded="false" aria-controls="dashboardSidebar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/>
    </svg>
  </button>

  <span class="db-topbar-title" th:text="${sectionTitle != null ? sectionTitle : 'Dashboard'}">Dashboard</span>

  <div class="db-topbar-user">
    <span class="db-topbar-business" th:text="${businessName}">Business Name</span>
    <span class="db-avatar" th:text="${businessName != null ? #strings.substring(businessName,0,1) : 'D'}">D</span>
  </div>
</header>

</body>
</html>
