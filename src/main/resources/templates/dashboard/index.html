<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${pageTitle}">Dashboard</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css" />
</head>
<body>

<div class="db-root">
  <div class="db-shell">

    <aside th:replace="~{dashboard/fragments/sidebar :: sidebar}"></aside>
    <div th:replace="~{dashboard/fragments/sidebar :: sidebarBackdrop}"></div>

    <div class="db-main">
      <header th:replace="~{dashboard/fragments/topbar :: topbar}"></header>

      <main class="db-content">

        <div class="db-welcome">
          <div>
            <h1>Welcome back, <span th:text="${businessName}">Business Name</span></h1>
            <p>Here's what's happening with your account today.</p>
          </div>
          <span class="db-date-pill" th:text="${today}">Today's date</span>
        </div>

        <section class="db-section">
          <h2 class="db-section-title">Your services</h2>
          <div class="db-grid db-grid-4">
            <article class="db-card db-service-card" th:each="service : ${services}">
              <div class="db-service-card-head">
                <h3 th:text="${service.name}">Service</h3>
                <span class="db-badge" th:classappend="${service.badgeClass}" th:text="${service.status}">Status</span>
              </div>
              <p th:text="${service.detail}">Service detail</p>
            </article>
          </div>
        </section>

        <section class="db-section db-grid-split">
          <div class="db-panel">
            <div class="db-panel-header">
              <h2>Notifications</h2>
              <a class="db-panel-link" href="/dashboard/messages">View all</a>
            </div>
            <div>
              <div class="db-notification-item"
                   th:each="notification : ${notifications}"
                   th:classappend="${notification.unread} ? 'is-unread'">
                <span class="db-notification-dot" aria-hidden="true"></span>
                <div class="db-notification-body">
                  <p class="db-notification-message" th:text="${notification.message}">Notification message</p>
                  <p class="db-notification-time" th:text="${notification.timeAgo}">Time ago</p>
                </div>
              </div>
            </div>
          </div>

          <div class="db-panel">
            <div class="db-panel-header">
              <h2>Recent activity</h2>
            </div>
            <div>
              <div class="db-activity-item" th:each="item : ${activity}">
                <span class="db-activity-dot" aria-hidden="true"></span>
                <div class="db-activity-body">
                  <p class="db-activity-description" th:text="${item.description}">Activity description</p>
                  <p class="db-activity-time" th:text="${item.timestamp}">Timestamp</p>
                </div>
              </div>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>
</div>

<script th:src="@{/js/dashboard.js}" src="/js/dashboard.js"></script>
</body>
</html>
