<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${pageTitle}">Dashboard</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css" />
</head>
<body>

<div class="db-root">
  <div class="db-shell">

    <aside th:replace="~{dashboard/fragments/sidebar :: sidebar}"></aside>
    <div th:replace="~{dashboard/fragments/sidebar :: sidebarBackdrop}"></div>

    <div class="db-main">
      <header th:replace="~{dashboard/fragments/topbar :: topbar}"></header>

      <main class="db-content">

        <div class="db-page-head">
          <h1 th:text="${sectionTitle}">Section</h1>
        </div>

        <div class="db-panel">
          <div class="db-empty-state">
            <div class="db-empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 4v5"/>
              </svg>
            </div>
            <h2 th:text="${sectionTitle}">Section</h2>
            <p th:text="${sectionDescription}">Section description.</p>
            <span class="db-empty-note">Coming soon</span>
          </div>
        </div>

      </main>
    </div>
  </div>
</div>

<script th:src="@{/js/dashboard.js}" src="/js/dashboard.js"></script>
</body>
</html>
